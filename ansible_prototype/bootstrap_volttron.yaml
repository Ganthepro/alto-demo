---
- name: Bootstrap Volttron
  hosts: test_ansible_1
  tasks:
    - name: Check if the volttron directory exists
      stat:
        path: "~/volttron"
      register: volttron_check
      delay: 2
      retries: 3
    - name: Bootstrap Volttron not Exists
      command: "git clone https://github.com/VOLTTRON/volttron --branch releases/8.x"
      register: res_log
      when: not volttron_check.stat.exists
      delay: 2
      retries: 3
    - debug: var=res_log.stdout_lines
      when: not volttron_check.stat.exists
    - name: Bootstrap Volttron Exists
      debug:
        msg: "Directory ~/volttron present"
      when: volttron_check.stat.exists
      delay: 2
      retries: 3
    - name: Check if the volttron/env directory exists
      stat:
        path: "~/volttron/env"
      register: env_check
      delay: 2
      retries: 3
    - name: Bootstrap Volttron Env not Exists
      command: "chdir=~/volttron python3 bootstrap.py"
      # register: res_log
      when: not env_check.stat.exists
      delay: 2
      retries: 3
    # - debug: var=res_log.stdout_lines
    #  when: not env_check.stat.exists
    - name: Bootstrap Volttron Env Exists
      debug:
        msg: "Directory ~/volttron/env present"
      when: env_check.stat.exists
      delay: 2
      retries: 3
