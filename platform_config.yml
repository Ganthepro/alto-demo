agents:
  ac:
    source: $VOLTTRON_ROOT/agents/AC
    config: $CONFIG/ac.config
    tag: ac
  data_logger:
    source: $VOLTTRON_ROOT/agents/DataLogger
    config: $CONFIG/data_logger.config
    tag: data_logger
  rest:
    source: $VOLTTRON_ROOT/agents/REST
    config: $CONFIG/rest.config
    tag: rest
  lifebeing:
    source: $VOLTTRON_ROOT/agents/Lifebeing
    config: $CONFIG/lifebeing.config
    tag: lifebeing
  iaq:
    source: $VOLTTRON_ROOT/agents/IAQ
    config: $CONFIG/iaq.config
    tag: iaq
config:
  bind-web-address: https://0.0.0.0:8443
  instance-name: volttron1
  message-bus: zmq
  vip-address: tcp://0.0.0.0:22916
  volttron-central-address: https://0.0.0.0:8443
